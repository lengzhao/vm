# Strict owned objects, durable recoverable batches, Docker build/run isolation.
# Replace IMAGE_ID / GO_VERSION with trusted local immutable image and actual version.
# Bump executionID when execution/gas/policy settings change.
# Parent directory must exist; the database file is exclusively locked.
# Exclusive state writer required during each batch; see docs/operations.md.
root: app
# Root Sender must be authenticated; child Sender is the calling contract.
plugins:
  state:
    use: state/bbolt
    config: {path: ./state.db, lockTimeout: 1s, maxBatchReceiptMB: 64}
  security:
    use: security/go
  abi:
    use: abi/go
  policy:
    use: policy/go
    config: {enableSecurity: true, deterministic: true}
    deps: {reviewer: security}
  validator:
    use: policy/artifact
    config: {requireDeterminism: true, targetOS: linux}
    deps: {policy: policy}
  deployer:
    use: deployment/default
    deps: {store: contracts, validator: validator}
  injector:
    use: gas/injector
  profiler:
    use: gas/profiler
  meters:
    use: gas/meters
  compiler:
    use: compiler/go
    config:
      outputDir: ./contracts
      buildTimeout: 2m
      goVersion: GO_VERSION
      requireDeterminism: true
      sandbox: {image: IMAGE_ID, memoryMB: 1024, cpus: 1, pids: 256, tmpMB: 512}
    deps: {policy: policy, abi: abi, injector: injector, profiler: profiler}
  contracts:
    use: storage/filesystem
    config: {directory: ./contracts}
  runner:
    use: runner/docker
    config:
      timeout: 30s
      sandbox: {image: IMAGE_ID, memoryMB: 256, cpus: 1, pids: 128, tmpMB: 64}
  components:
    use: engine/components
    deps:
      state: state
      policy: policy
      abi: abi
      compiler: compiler
      contracts: contracts
      runner: runner
      meters: meters
      estimator: profiler
      deployer: deployer
      validator: validator
  authorizer:
    use: objects/owner
  objects:
    use: objects/transactional
    deps: {authorizer: authorizer}
  engine:
    use: engine/objects
    config: {executionTimeout: 30s, enableGasMetering: true, maxGasLimit: 1000000, maxCallDepth: 8}
    deps: {components: components, objects: objects}
  batch:
    use: batch/recoverable
    config: {workers: 4, maxBatch: 1024, executionID: strict-docker-objects-owner-gas1m-v1}
    deps: {state: state, executor: engine, contracts: engine}
  app:
    use: engine/recoverable
    deps: {engine: engine, batch: batch}
